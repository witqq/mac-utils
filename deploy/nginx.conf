server {
    listen 4080;
    listen [::]:4080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # The agentic-report runtime applies inline style declarations; scripts stay 'self' only.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
        expires -1;
    }

    # Content-hashed build assets are immutable; unhashed identity files stay short-lived.
    location ~* ^/assets/.+\.[0-9a-f]{12}\.(?:css|js|png|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|png|webp)$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri =404;
        expires -1;
    }
}
