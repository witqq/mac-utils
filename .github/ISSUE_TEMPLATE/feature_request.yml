name: Feature request
description: Propose a reusable Mac Utils utility or product improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the outcome, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Explain the starting state, user action, and observable result.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Existing action, provider, or builder primitive
      description: Could this compose or extend an existing mechanism?
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: macOS API, permission, sandbox, or hardware constraints
      description: Add primary-source links when known. Do not include credentials or private data.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand that a proposal is not a release commitment.
          required: true
